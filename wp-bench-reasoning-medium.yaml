# GPT-5.2 with reasoning_effort: medium
dataset:
  source: local
  name: wp-core-v1

models:
  - name: gpt-5.2
    temperature: 1.0
    reasoning_effort: medium

grader:
  kind: docker
  wp_env_dir: ./runtime

run:
  suite: wp-core-v1
  concurrency: 2

output:
  path: output/results-reasoning-medium.json
  jsonl_path: output/results-reasoning-medium.jsonl
